<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- frame-ancestors is not honoured in a meta CSP and logs an error there; it ships on the response header instead (src/ui/static.ts UI_CSP). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; connect-src 'self'; img-src 'self' blob: data:; font-src 'self'; style-src 'self'; base-uri 'self'; form-action 'self'" />
    <meta name="color-scheme" content="light dark" />
    <title>BotHearth</title>
    <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/fraunces-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Order is load-bearing: tokens -> base -> shell -> views. The ground is
         painted by a render-blocking sheet, so the window never flashes white. -->
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/shell.css" />
    <!-- Per-area view sheets. Every one of these is listed in
         static.ts uiReferencedAssets(), so a sheet missing from a package is a
         failing smoke test rather than an unstyled screen. -->
    <link rel="stylesheet" href="/home.css" />
    <link rel="stylesheet" href="/task.css" />
    <link rel="stylesheet" href="/settings.css" />
  </head>
  <body>
    <div class="win" id="shell">
      <header class="titlebar" id="titlebar">
        <button class="tb-back" id="tb-back" type="button" hidden aria-label="All tasks">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
        </button>
        <a class="brand" id="tb-brand" href="#/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">BotHearth</span>
        </a>
        <span class="tb-title" id="tb-title" hidden>
          <span class="dot" id="tb-title-dot" hidden></span>
          <span id="tb-title-text"></span>
        </span>
        <div class="tb-spacer"></div>
        <div class="tb-cluster">
          <a class="chip" id="tb-tasks" href="#/tasks">Tasks</a>
          <a class="chip" id="tb-licence" href="#/settings/licence" hidden></a>
          <button class="chip" id="tb-pill" type="button" hidden>
            <span class="dot"></span><span class="label"></span><span class="sub" hidden></span>
          </button>
          <button class="iconbtn" id="tb-settings" type="button" aria-label="Settings">
            <!-- A toothed cog, not a ring with rays: at 16px the ray form reads as a
                 sun. Eight teeth, drawn as one closed outline. -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M 10.22 2.82 L 13.78 2.82 L 14.03 5.14 L 15.41 5.72 L 17.23 4.25 L 19.75 6.77 L 18.28 8.59 L 18.86 9.97 L 21.18 10.22 L 21.18 13.78 L 18.86 14.03 L 18.28 15.41 L 19.75 17.23 L 17.23 19.75 L 15.41 18.28 L 14.03 18.86 L 13.78 21.18 L 10.22 21.18 L 9.97 18.86 L 8.59 18.28 L 6.77 19.75 L 4.25 17.23 L 5.72 15.41 L 5.14 14.03 L 2.82 13.78 L 2.82 10.22 L 5.14 9.97 L 5.72 8.59 L 4.25 6.77 L 6.77 4.25 L 8.59 5.72 L 9.97 5.14 Z" /><circle cx="12" cy="12" r="3.05" /></svg>
          </button>
        </div>
      </header>
      <!-- The in-app "your bot needs you" strip. macOS refuses notifications to
           an ad-hoc signed build, so this is the surface that always works.
           Assertive: it is the one thing that must interrupt. -->
      <div class="needs-you" id="needs-you" role="alert" hidden></div>
      <div class="shell-view" id="view-root"></div>
      <!-- Overlays (the Settings sheet) mount here, over the live view rather
           than in place of it. See the registerOverlay block in shell.ts. -->
      <div class="shell-overlay" id="overlay-root"></div>
      <div class="toasts" id="toasts">
        <div class="toast-region" id="toast-polite" role="status" aria-live="polite"></div>
        <div class="toast-region" id="toast-assertive" role="alert" aria-live="assertive"></div>
      </div>
    </div>


    <script type="module" src="/main.js"></script>
  </body>
</html>
