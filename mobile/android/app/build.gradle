    defaultConfig { applicationId 'org.modelbot.mobile'; minSdk 28; targetSdk 36; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'org.modelbot.mobile.NativeAcceptance' }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
