<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="BotHearth">
  <title>BotHearth</title>
  <!-- the Cairn: three stones stacked to mark open ground. Widths 17 / 11.5 / 6.75,
       centres offset 12.0 / 12.75 / 11.625 so the stack balances rather than grades. -->
  <rect x="3.5" y="16" width="17" height="4.25" rx="1.75" fill="currentColor"/>
  <rect x="7" y="10.75" width="11.5" height="4.25" rx="1.75" fill="currentColor"/>
  <rect x="8.25" y="5.5" width="6.75" height="4.25" rx="1.75" fill="currentColor"/>
</svg>
