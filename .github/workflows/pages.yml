name: Website
on:
  pull_request:
    paths: ['website/**', 'enterprise/**', 'scripts/build-site.mjs', 'scripts/check-site.mjs', 'tests/unit/website/**', '.github/workflows/pages.yml', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['website/**', 'enterprise/**', 'scripts/build-site.mjs', 'scripts/check-site.mjs', 'tests/unit/website/**', '.github/workflows/pages.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
env:
  MODELBOT_NO_OPEN: '1'
  CI: '1'
  SITE_CONTACT_URL: ${{ vars.SITE_CONTACT_URL }}
  SITE_ENTERPRISE_URL: ${{ vars.SITE_ENTERPRISE_URL }}
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run site:test
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: .site-build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy the static website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
